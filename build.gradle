plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.muehlbachler'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(27)
  }
}

repositories {
    mavenCentral()
}
ext {
  set('springCloudVersion', "2025.1.2")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'com.google.code.gson:gson:2.14.0'

    // TODO: pin lombok to this version until the update for JDK 27 hits core spring boot
    compileOnly 'org.projectlombok:lombok:1.18.48'

    runtimeOnly 'com.h2database:h2'

    // TODO: pin lombok to this version until the update for JDK 27 hits core spring boot
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-resttestclient'
  testImplementation 'org.springframework.boot:spring-boot-restclient'
  testImplementation 'org.wiremock.integrations:wiremock-spring-boot:4.2.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
  }
}

tasks.named('test') {
    useJUnitPlatform()

    testLogging {
		events "PASSED", "SKIPPED", "FAILED"
        exceptionFormat "full"
	}
}

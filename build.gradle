plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'pmd'
}

group = 'io.muehlbachler'
version = ''

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(27)
  }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'com.google.code.gson:gson:2.14.0'

    // TODO: pin lombok to this version until the update for JDK 27 hits core spring boot
    compileOnly 'org.projectlombok:lombok:1.18.48'

    runtimeOnly 'com.h2database:h2'

    // TODO: pin lombok to this version until the update for JDK 27 hits core spring boot
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.wiremock.integrations:wiremock-spring-boot:4.2.2'
    testImplementation 'au.com.dius.pact.consumer:junit5:4.7.5'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

pmd {
    consoleOutput = true
    ruleSetFiles = files("config/pmd/ruleset.xml")
    toolVersion = "7.26.0"
}

tasks.named('test') {
    useJUnitPlatform()

    testLogging {
		events "PASSED", "SKIPPED", "FAILED"
        exceptionFormat "full"
	}

    systemProperty 'pact.rootDir', file("$rootDir/pact").path
}

---
name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  conform:
    runs-on: ubuntu-latest
    name: Conform

    steps:
      - uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: siderolabs/conform@v0.1.0-alpha.31
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    strategy:
      max-parallel: 4
      matrix:
        java-version: ["26"]

    steps:
      - uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "${{ matrix.java-version }}"
          distribution: "corretto"
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test

  check:
    runs-on: ubuntu-latest
    name: Check Code
    strategy:
      max-parallel: 4
      matrix:
        java-version: ["26"]

    steps:
      - uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "${{ matrix.java-version }}"
          distribution: "corretto"
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew check
        continue-on-error: true # Continue even if there are errors

  hadolint:
    runs-on: ubuntu-latest
    name: Lint Dockerfile

    steps:
      - uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

  build:
    runs-on: ubuntu-latest
    name: Build Jar File
    needs:
      - test
      - check
    strategy:
      max-parallel: 4
      matrix:
        java-version: ["26"]

    steps:
      - uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "${{ matrix.java-version }}"
          distribution: "corretto"
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew bootJar

      - uses: actions/upload-artifact@v7
        with:
          name: spring-boot-jar
          path: build/libs/bswe.jar

  container:
    runs-on: ubuntu-latest
    name: Container
    needs:
      - build
      - hadolint
    permissions:
      contents: read
      packages: write

    steps:
      - uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: echo "nothing to do here..."
